# ==============================================================================
# SignTalk AI — Real-Time Camera & Landmark Streaming Configuration
# Phase 4 Part 1 — Real-Time Ingestion Layer
# ==============================================================================

camera:
  device_index: 0
  width: 640
  height: 480
  target_fps: 25.0
  auto_reconnect: true
  max_reconnect_attempts: 3
  reconnect_delay_sec: 1.0

processing:
  flip_horizontal: true
  color_format: "RGB"
  target_width: null
  target_height: null

mediapipe:
  pose_model_path: "models/mediapipe/pose_landmarker_full.task"
  hand_model_path: "models/mediapipe/hand_landmarker.task"
  face_model_path: "models/mediapipe/face_landmarker.task"
  pose_detection_confidence: 0.50
  pose_presence_confidence: 0.50
  pose_tracking_confidence: 0.50
  hand_detection_confidence: 0.35
  hand_presence_confidence: 0.35
  hand_tracking_confidence: 0.35
  face_detection_confidence: 0.40
  face_presence_confidence: 0.40
  enable_hands: true
  enable_pose: true
  enable_face: false  # Face mesh optional; upper-facial pose anchors provide stable cranial reference

landmark_budget:
  total_nodes: 93
  left_hand_nodes: 21
  right_hand_nodes: 21
  pose_nodes: 11
  face_nodes: 40

normalization:
  method: "torso_scale"
  center_point: "mid_shoulder"
  scale_reference: "shoulder_distance"
  min_scale_epsilon: 1.0e-4
  z_scale_factor: 1.0
  use_temporal_anchor_smoothing: true
  anchor_smoothing_alpha: 0.25  # Exponential moving average factor for torso center & scale

quality:
  min_valid_pose_ratio: 0.70
  min_valid_hand_ratio: 0.30
  overall_quality_threshold: 0.50
  max_consecutive_missing: 10
  min_valid_frames_in_sequence: 15
  jump_distance_threshold: 0.35  # Maximum plausible normalized displacement per frame before flagging jump warning
  weights:
    pose: 0.40
    dominant_hand: 0.40
    non_dominant_hand: 0.15
    face: 0.05
  classification_thresholds:
    good: 0.75
    acceptable: 0.50
    review: 0.35

stream:
  buffer_capacity: 120
  drop_policy: "drop_oldest"
  warmup_frames: 10

runtime:
  display_preview: true
  preview_window_name: "SignTalk AI — Real-Time Landmark Stream"
  save_debug_frames: false

debug:
  record_landmarks: false  # Privacy-first default: Never record without explicit opt-in
  record_video: false      # Privacy-first default: Never store raw video frames
  record_dir: "experiments/realtime_debug"

buffer:
  max_length: 45           # Fixed temporal window size matching ST-GCN training (45 frames @ 25 FPS = 1.8s)
  min_valid_frames: 15     # Minimum valid frames for window quality gate
  interpolate_missing_frames: true
  max_consecutive_interpolated: 10

scheduler:
  stride: 5                # Slide stride: trigger inference every 5 new frames (200ms update cadence @ 25 FPS)
  drop_stale_windows: true # Discard queued windows if ST-GCN is currently processing

inference:
  enabled: true
  checkpoint_path: "experiments/stgcn/checkpoints/best_checkpoint.pt"
  device: "auto"           # "auto", "cpu", or "cuda"
  top_k: 3                 # Top-K prediction ranks
  warmup_iterations: 5     # Warm-up cycles before measurement
  record_predictions: false # Whether to record predictions to CSV
  predictions_csv: "results/realtime/predictions.csv"
  verbose_console: false

# ==============================================================================
# Phase 4 Part 3 — Confidence, Smoothing & Continuous Sign Detection
# ==============================================================================

confidence:
  threshold: 0.65          # Empirically selected from validation set threshold evaluation
  source: "validation"
  uncertain_label: "UNCERTAIN"

smoothing:
  method: "majority_vote"  # Options: "majority_vote", "confidence_weighted", "temporal_stability"
  history_size: 5          # History depth (5 predictions = 1.0s window buffer)
  min_votes: 3             # Quorum for majority consensus
  decay_factor: 0.85       # For confidence_weighted smoothing
  min_consecutive: 2       # For temporal_stability smoothing

stability:
  min_consecutive_predictions: 2  # Transitions CANDIDATE -> ACTIVE
  min_confidence: 0.65
  min_input_quality: 0.40

events:
  minimum_gap_ms: 800.0    # Minimum temporal separation between distinct repetitions
  unknown_timeout_ms: 1000.0 # Duration of uncertainty before resetting to IDLE
  log_events: false        # Default disabled; enable for logging events to CSV
  events_csv: "results/realtime/events.csv"

sequence:
  max_events: 50           # Maximum discrete sign events retained in continuous buffer

# ==============================================================================
# Phase 4 Part 4 — End-to-End Real-Time Pipeline & Translation Layer
# ==============================================================================

translation:
  enabled: true
  mode: "gloss_to_text"    # "gloss_to_text" (linguistic templates/lexicon) or "visual_transformer"
  pause_threshold_sec: 1.5 # Temporal silence required to commit phrase to transcript
  min_confidence: 0.50     # Gating threshold for sign tokens in translation
  max_phrase_signs: 10     # Max signs per utterance before auto-committing
  transformer_checkpoint: "experiments/transformer/checkpoints/best_checkpoint.pt"

performance:
  profiling_enabled: true  # Enables microsecond stage latency profiling
  history_size: 500        # Rolling history depth for percentile calculations
  benchmark_runs: 100      # Sample size for official benchmarking suite

pipeline:
  mode: "debug"            # "debug" (full HUD), "benchmark" (low overhead), "production"
  enable_overlay: true     # Display graphical diagnostic canvas
  enable_translation: true # Dispatch linguistic translation on finalized events


