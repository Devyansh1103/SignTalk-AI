version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signtalk-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SIGNTALK_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - INFERENCE_DEVICE=cpu
      - MODEL_CHECKPOINT_PATH=/app/models/checkpoints/stgcn_trans_v1.pt
      - VOCABULARY_PATH=/app/assets/vocabularies/mvp_50.json
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./logs:/app/logs:rw
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    networks:
      - signtalk-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signtalk-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - signtalk-net

networks:
  signtalk-net:
    driver: bridge
